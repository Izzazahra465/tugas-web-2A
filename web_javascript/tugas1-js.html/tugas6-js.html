<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penggunaan Array</title>
</head>
<body>
    
    <script type="text/javascript">
        // membuat array
        var siswa = ['Andi', 'Budi', 'Caca', 'Deni', 'Eka'];
        console.log(siswa); //menampilkan semua data

        var harga = [1000, 2000, 3000,];
        console.log(harga); //menampilkan data ke - 3

        // menampilkam array dengan perulangan
        siswa.forEach(function(data) {
            document.write('Nama Siswa adalah ' + data + '<br>');
        });

    </script>
</body>
</html>
